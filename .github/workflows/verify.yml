name: Verify course

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install book dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify code and contracts
        run: python -B tools/verify.py
      - name: Verify book structure and renderer
        shell: pwsh
        run: |
          python -B tools/book.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/book.py build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/check_pdf.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- dist/csharp.md
      - name: Upload book and validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: course-validation
          path: |
            dist/csharp.pdf
            dist/csharp.md
            .artifacts/engineering/summary.json
            .artifacts/engineering/boundary-repro.txt
          include-hidden-files: true
          retention-days: 7

name: Verify course

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install book dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify code and contracts
        run: python -B tools/verify.py
      - name: Verify book structure and renderer
        shell: pwsh
        run: |
          python -B tools/book.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/book.py build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/check_pdf.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- dist/csharp.md
      - name: Upload book and validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: course-validation
          path: |
            dist/csharp.pdf
            dist/csharp.md
            .artifacts/engineering/summary.json
            .artifacts/engineering/boundary-repro.txt
            .artifacts/data/summary.json
            .artifacts/data/query-plan.txt
          include-hidden-files: true
          retention-days: 7
